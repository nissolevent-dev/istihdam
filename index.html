<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İstihdam Eşleştirme Takip Paneli</title>
<meta name="theme-color" content="#171C2B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="İstihdam Takip">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --ink: #171C2B; --surface: #1F2536; --surface2: #262D42; --line: #323B54;
    --paper: #EDEAE1; --muted: #8A93AC; --amber: #D9A441; --signal: #4F9D69;
    --rose: #C1666B; --wire: #6C8EBF;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ink); color: var(--paper); font-family: -apple-system, 'Inter', sans-serif;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  .app { display: flex; min-height: 100vh; }
  aside { width: 240px; flex-shrink: 0; border-right: 1px solid var(--line); padding: 22px 14px; display: flex; flex-direction: column; gap: 4px; }
  .brand { padding: 0 10px 20px; }
  .brand h1 { font-size: 16.5px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .brand p { font-size: 12px; color: var(--muted); margin: 2px 0 0; }
  nav { display: flex; flex-direction: column; gap: 4px; }
  nav button { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; background: transparent; border: none; cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 500; text-align: left; width: 100%; font-family: inherit; }
  nav button.active { background: var(--surface2); color: var(--paper); font-weight: 600; }
  nav button .dot { margin-left: auto; width: 6px; height: 6px; border-radius: 999px; background: var(--line); flex-shrink: 0; }
  nav button .dot.on { background: var(--signal); }
  nav button .dot.err { background: var(--rose); }
  .sep { height: 1px; background: var(--line); margin: 10px 4px; }
  .foot { padding: 14px 10px 0; font-size: 12px; color: var(--muted); }
  .settings-desktop { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; background: transparent; border: none; cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 500; text-align: left; width: 100%; font-family: inherit; margin-top: auto; }
  .settings-desktop:hover { background: var(--surface2); }
  main { flex: 1; padding: 28px 34px; min-width: 0; }
  .headrow { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; flex-wrap: wrap; gap: 10px; }
  h2 { font-size: 22px; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .sub { font-size: 12.5px; color: var(--muted); margin-top: 3px; }
  .btn { display: flex; align-items: center; gap: 7px; padding: 8px 14px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--line); color: var(--paper); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; flex-shrink: 0; }
  .btn:disabled { opacity: 0.6; cursor: default; }
  .search-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .search-row input { flex: 1; min-width: 140px; max-width: 320px; background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; color: var(--paper); font-size: 16px; outline: none; font-family: inherit; }
  .count { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; -webkit-overflow-scrolling: touch; position: relative; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; padding: 10px 14px; color: var(--muted); font-weight: 600; font-size: 11.5px; letter-spacing: 0.05em; text-transform: uppercase; border-bottom: 1px solid var(--line); background: var(--surface2); white-space: nowrap; }
  td { padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  tr:nth-child(even) { background: var(--surface); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
  .empty { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 56px 20px; color: var(--muted); text-align: center; }
  .empty .title { color: var(--paper); font-weight: 600; font-size: 15px; }
  .empty .hint { font-size: 13.5px; max-width: 360px; }
  .settings-note { background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 20px; font-size: 13.5px; line-height: 1.6; max-width: 640px; }
  .icon { width: 16px; height: 16px; flex-shrink: 0; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .spinning { animation: spin 0.9s linear infinite; }

  .settings-mobile { display: none; }

  .pw-overlay {
    position: fixed; inset: 0; background: rgba(10,13,22,0.72); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .pw-box { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; width: 100%; max-width: 280px; text-align: center; }
  .pw-title { font-weight: 700; font-size: 15px; margin-bottom: 14px; }
  .pw-box input {
    width: 100%; text-align: center; letter-spacing: 10px; font-size: max(22px, 16px); padding: 10px 12px;
    background: var(--surface2); border: 1px solid var(--line); border-radius: 8px; color: var(--paper);
    outline: none; font-family: inherit;
  }
  .pw-error { color: var(--rose); font-size: 12.5px; margin-top: 10px; }
  .pw-actions { display: flex; gap: 8px; margin-top: 16px; }
  .pw-actions .btn { flex: 1; justify-content: center; }
  .btn-primary { background: var(--amber); color: #1a1408; border-color: var(--amber); }

  @media (max-width: 720px) {
    body { padding-bottom: calc(64px + env(safe-area-inset-bottom)); }
    .app { flex-direction: column; }
    aside {
      width: 100%; flex-direction: column; align-items: stretch; gap: 8px;
      border-right: none; border-bottom: 1px solid var(--line);
      padding: 12px 10px;
    }
    .brand { padding: 0 4px; flex-shrink: 0; }
    .brand p { display: none; }
    .navrow { width: 100%; }
    nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; width: 100%; }
    nav button { width: 100%; flex-direction: column; gap: 4px; padding: 8px 4px; font-size: 10.5px; text-align: center; }
    nav button span:first-child { font-size: 17px; }
    nav button .dot { margin-left: 0; }
    .foot { display: none; }
    .settings-desktop { display: none; }
    .settings-mobile {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
      padding: 14px 14px calc(14px + env(safe-area-inset-bottom));
      background: var(--surface); border-top: 1px solid var(--line);
      color: var(--paper); font-size: 14px; font-weight: 600; border: none; border-top: 1px solid var(--line);
      font-family: inherit;
    }
    main { padding: 16px 14px; }
    h2 { font-size: 19px; }
    .headrow { margin-bottom: 16px; }
    td, th { padding: 8px 10px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <h1>İstihdam Eşleştirme</h1>
      <p>Takip Paneli</p>
    </div>
    <div class="navrow">
      <nav id="nav"></nav>
    </div>
    <div class="foot" id="footStatus">0/4 kaynak bağlı</div>
    <button id="settingsBtnDesktop" class="settings-desktop">⚙️&nbsp;&nbsp;Ayarlar</button>
  </aside>
  <main>
    <div class="headrow">
      <div>
        <h2 id="pageTitle">Adaylar</h2>
        <div class="sub" id="pageSub">Yükleniyor…</div>
      </div>
      <button class="btn" id="refreshBtn">↻ Yenile</button>
    </div>
    <div id="content"></div>
  </main>
</div>

<button id="settingsBtnMobile" class="settings-mobile">⚙️ Ayarlar</button>

<div id="pwOverlay" class="pw-overlay" style="display:none">
  <div class="pw-box">
    <div class="pw-title">Ayarlar Şifresi</div>
    <input id="pwInput" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="••••">
    <div id="pwError" class="pw-error" style="display:none">Yanlış şifre</div>
    <div class="pw-actions">
      <button id="pwCancel" class="btn">Vazgeç</button>
      <button id="pwSubmit" class="btn btn-primary">Gir</button>
    </div>
  </div>
</div>

<script>
const BASE = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vROiM8pJHjFgFZM0SqPIFPxBb4Av_g_JjeKklOiVapz3sZQNw6NjhSiRasynnPtARWYNzHP8mCe-UAF/pub';
const LINKS = {
  adaylar:   BASE + '?gid=606438697&single=true&output=csv',
  ilanlar:   BASE + '?gid=141710932&single=true&output=csv',
  eslesmeler:BASE + '?gid=1594229811&single=true&output=csv',
  panel:     BASE + '?gid=1432942367&single=true&output=csv',
};
const SECTIONS = [
  { id: 'adaylar', label: 'Adaylar', icon: '👥' },
  { id: 'ilanlar', label: 'İlanlar', icon: '💼' },
  { id: 'eslesmeler', label: 'Eşleşmeler', icon: '🔗' },
  { id: 'panel', label: 'Yönetim Paneli', icon: '📡' },
];
const AUTO_REFRESH_MS = 3 * 60 * 1000; // 3 dakika

let state = { active: 'adaylar', data: {}, query: '' };
for (const s of SECTIONS) state.data[s.id] = { headers: [], rows: [], loading: true, error: null, updatedAt: null };

function statusTone(raw) {
  const v = (raw || '').toLocaleLowerCase('tr');
  if (!v) return null;
  if (v.includes('reddedil') || v.includes('pasif') || v.includes('iptal')) return { cls: 'rose', color: 'var(--rose)' };
  if (v.includes('eşleş') || v.includes('onay') || v.includes('tamamlan') || v.includes('aktif')) return { cls: 'signal', color: 'var(--signal)' };
  if (v.includes('bekliyor') || v.includes('beklemede') || v.includes('inceleniyor')) return { cls: 'amber', color: 'var(--amber)' };
  return { cls: 'wire', color: 'var(--wire)' };
}

function findStatusCol(headers) {
  const norm = h => (h || '').toLocaleLowerCase('tr');
  return headers.findIndex(h => norm(h).includes('durum') || norm(h).includes('status'));
}

function esc(s) {
  return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function timeAgo(date) {
  if (!date) return null;
  const s = Math.floor((Date.now() - date.getTime()) / 1000);
  if (s < 10) return 'az önce';
  if (s < 60) return s + ' sn önce';
  const m = Math.floor(s / 60);
  if (m < 60) return m + ' dk önce';
  const h = Math.floor(m / 60);
  return h + ' sa önce';
}

async function fetchSheet(id) {
  const url = LINKS[id] + '&_ts=' + Date.now();
  state.data[id].loading = true;
  state.data[id].error = null;
  renderNav(); renderFoot();
  try {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const parsed = Papa.parse(text.trim(), { skipEmptyLines: true });
    const rows = parsed.data;
    const headers = rows.length ? rows[0] : [];
    const body = rows.length ? rows.slice(1).filter(r => r.some(c => (c || '').toString().trim() !== '')) : [];
    state.data[id] = { headers, rows: body, loading: false, error: null, updatedAt: new Date() };
  } catch (e) {
    state.data[id].loading = false;
    state.data[id].error = 'Veri çekilemedi: ' + (e.message || 'bilinmeyen hata');
  }
  renderNav(); renderFoot();
  if (state.active === id) renderMain();
}

async function fetchAll() {
  await Promise.all(SECTIONS.map(s => fetchSheet(s.id)));
}

function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = SECTIONS.map(s => {
    const d = state.data[s.id];
    const dotClass = d.error ? 'err' : (d.headers.length > 0 ? 'on' : '');
    return `<button data-id="${s.id}" class="${state.active === s.id ? 'active' : ''}">
      <span>${s.icon}</span><span style="flex:1">${s.label}</span><span class="dot ${dotClass}"></span>
    </button>`;
  }).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => { state.active = b.dataset.id; state.query=''; render(); });
}

function renderFoot() {
  const connected = SECTIONS.filter(s => state.data[s.id].headers.length > 0).length;
  document.getElementById('footStatus').textContent = `${connected}/4 kaynak bağlı`;
}

function renderMain() {
  const sec = SECTIONS.find(s => s.id === state.active);
  const d = state.data[state.active];
  document.getElementById('pageTitle').textContent = sec.label;
  document.getElementById('pageSub').textContent = d.loading ? 'Yükleniyor…' : (d.updatedAt ? 'Son güncelleme: ' + timeAgo(d.updatedAt) : 'Henüz veri yok');

  const content = document.getElementById('content');

  if (d.error) {
    content.innerHTML = `<div class="empty">
      <div class="title" style="color:var(--rose)">⚠ ${esc(d.error)}</div>
      <div class="hint">Bağlantının hâlâ "Web'de yayınla → CSV" olarak açık olduğundan emin ol.</div>
    </div>`;
    return;
  }

  if (!d.headers.length) {
    content.innerHTML = `<div class="empty">
      <div class="title">${d.loading ? 'Yükleniyor…' : 'Kayıt yok'}</div>
      <div class="hint">${d.loading ? '' : 'Bu sekmede henüz veri bulunmuyor.'}</div>
    </div>`;
    return;
  }

  content.innerHTML = `<div class="search-row">
    <input id="searchInput" placeholder="Ara..." value="${esc(state.query)}">
    <div class="count" id="resultsCount"></div>
  </div>
  <div id="resultsArea"></div>`;

  document.getElementById('searchInput').oninput = (e) => {
    state.query = e.target.value;
    renderResults();
  };

  renderResults();
}

function renderResults() {
  const d = state.data[state.active];
  const statusIdx = findStatusCol(d.headers);
  const q = state.query.trim().toLocaleLowerCase('tr');
  const filtered = q ? d.rows.filter(r => r.some(c => (c || '').toString().toLocaleLowerCase('tr').includes(q))) : d.rows;

  document.getElementById('resultsCount').textContent = filtered.length + ' kayıt';

  let html = `<div class="tablewrap"><table><thead><tr>${d.headers.map(h => `<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>`;
  if (!filtered.length) {
    html += `<tr><td colspan="${d.headers.length}" style="text-align:center;padding:24px;color:var(--muted)">Kayıt bulunamadı</td></tr>`;
  } else {
    for (const row of filtered) {
      html += '<tr>' + row.map((cell, ci) => {
        if (ci === statusIdx) {
          const tone = statusTone(cell);
          if (!tone) return `<td style="color:var(--muted)">${esc(cell) || '—'}</td>`;
          return `<td><span class="badge" style="background:${tone.color}1c;color:${tone.color};border:1px solid ${tone.color}40">${esc(cell)}</span></td>`;
        }
        return `<td>${esc(cell) || '—'}</td>`;
      }).join('') + '</tr>';
    }
  }
  html += '</tbody></table></div>';
  document.getElementById('resultsArea').innerHTML = html;
  applyStickyColumns(5);
}

function applyStickyColumns(n) {
  const table = document.querySelector('#resultsArea table');
  if (!table) return;
  const theadRow = table.querySelector('thead tr');
  const tbodyRows = table.querySelectorAll('tbody tr');
  if (!theadRow) return;
  const headerCells = Array.from(theadRow.children);
  const count = Math.min(n, headerCells.length);

  const offsets = [];
  let acc = 0;
  for (let i = 0; i < count; i++) {
    offsets.push(acc);
    acc += headerCells[i].getBoundingClientRect().width;
  }

  const styleCell = (cell, i, bg, z) => {
    cell.style.position = 'sticky';
    cell.style.left = offsets[i] + 'px';
    cell.style.zIndex = z;
    cell.style.background = bg;
    cell.style.boxShadow = (i === count - 1) ? '2px 0 4px -2px rgba(0,0,0,0.5), 1px 0 0 var(--line)' : '';
  };

  for (let i = 0; i < count; i++) styleCell(headerCells[i], i, 'var(--surface2)', 3);

  tbodyRows.forEach((row, ri) => {
    const bg = (ri % 2 === 1) ? 'var(--surface)' : 'var(--ink)';
    for (let i = 0; i < count; i++) {
      const cell = row.children[i];
      if (cell) styleCell(cell, i, bg, 2);
    }
  });
}

function render() { renderNav(); renderFoot(); renderMain(); }

document.getElementById('refreshBtn').onclick = () => {
  const btn = document.getElementById('refreshBtn');
  const icon = btn.querySelector('.spin-icon');
  fetchSheet(state.active);
};

const SETTINGS_PASSWORD = '2580';

function openSettings() {
  const content = document.getElementById('content');
  document.getElementById('pageTitle').textContent = 'Ayarlar';
  document.getElementById('pageSub').textContent = '';
  let html = `<div class="settings-note">
    Bu sayfa Google Sheets'e her ${AUTO_REFRESH_MS/60000} dakikada bir otomatik bağlanıp veriyi tazeler,
    ayrıca "Yenile" butonuyla anında de güncelleyebilirsin. Kaynaklar aşağıda listelenir.
  </div>`;
  for (const s of SECTIONS) {
    html += `<div style="margin-bottom:14px"><div style="font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:4px">${s.label}</div>
    <div style="font-family:ui-monospace,monospace;font-size:12px;color:var(--paper);word-break:break-all;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 12px">${esc(LINKS[s.id])}</div></div>`;
  }
  content.innerHTML = html;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
}

function askForSettingsPassword() {
  const overlay = document.getElementById('pwOverlay');
  const input = document.getElementById('pwInput');
  const error = document.getElementById('pwError');
  input.value = '';
  error.style.display = 'none';
  overlay.style.display = 'flex';
  setTimeout(() => input.focus(), 50);

  const cleanup = () => {
    overlay.style.display = 'none';
    document.getElementById('pwSubmit').onclick = null;
    document.getElementById('pwCancel').onclick = null;
    input.onkeydown = null;
  };

  const trySubmit = () => {
    if (input.value === SETTINGS_PASSWORD) {
      cleanup();
      openSettings();
    } else {
      error.style.display = 'block';
      input.value = '';
      input.focus();
    }
  };

  document.getElementById('pwSubmit').onclick = trySubmit;
  document.getElementById('pwCancel').onclick = cleanup;
  input.onkeydown = (e) => { if (e.key === 'Enter') trySubmit(); };
}

document.getElementById('settingsBtnDesktop').onclick = askForSettingsPassword;
document.getElementById('settingsBtnMobile').onclick = askForSettingsPassword;

render();
fetchAll();
setInterval(fetchAll, AUTO_REFRESH_MS);
</script>
</body>
</html>
